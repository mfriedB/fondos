name: Muestras formato planillas
on:
  push:
    branches: [cafci-datos]
    paths: ['cafci/explorar/muestras.py', '.github/workflows/cnv-muestras.yml']
permissions:
  contents: write
jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {ref: cafci-datos}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install requests openpyxl
      - run: timeout 600 python -u cafci/explorar/muestras.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cafci/explorar/out && git commit -m "Muestras formato" && git pull --rebase origin cafci-datos && git push origin HEAD:cafci-datos || true
