# Descarga las planillas diarias oficiales (CNV / CAFCI) y las guarda en la rama cafci-datos.
# Solo corre en la rama cafci-datos: no toca main ni la pagina publicada.
name: Planillas CAFCI-CNV

on:
  push:
    branches: [cafci-datos]
    paths: ['cafci/**', '.github/workflows/cafci-cnv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cafci-cnv
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cafci-datos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl pandas
      - name: Cache de planillas originales
        uses: actions/cache@v4
        with:
          path: cafci/raw
          key: planillas-${{ github.run_id }}
          restore-keys: planillas-
      - name: Descargar
        run: |
          timeout 1500 python -u cafci/descargar_cnv.py
      - name: Procesar (formato 1816)
        run: python -u cafci/procesar.py
      - name: Commitear resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for d in cafci/procesado; do [ -e "$d" ] && git add "$d"; done
          if ! git diff --cached --quiet; then
            git commit -m "Planillas CAFCI-CNV: actualizacion automatica"
            git push origin HEAD:cafci-datos
          fi
