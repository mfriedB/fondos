# Descarga las planillas diarias oficiales (CNV / CAFCI) y las guarda en la rama cafci-datos.
# Solo corre en la rama cafci-datos: no toca main ni la pagina publicada.
name: Planillas CAFCI-CNV

on:
  push:
    branches: [cafci-datos]
    paths: ['cafci/*.py', 'cafci/config.json', '.github/workflows/cafci-cnv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cafci-cnv
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cafci-datos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl pandas
      - name: Recuperar planillas originales (cache)
        uses: actions/cache/restore@v4
        with:
          path: cafci/raw
          key: planillas-${{ github.run_id }}
          restore-keys: planillas-
      - name: Descargar
        continue-on-error: true   # un timeout puntual de la CNV no frena el resto; se reintenta en la proxima corrida
        run: |
          timeout 7200 python -u cafci/descargar_cnv.py
      - name: Informes mensuales CAFCI (cuotapartistas)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -u cafci/bajar_informes.py
      - name: Dolar MEP y BCRA A3500
        continue-on-error: true
        run: python -u cafci/dolar.py
      - name: Procesar (formato 1816)
        run: python -u cafci/procesar.py
      - name: Cuotapartistas (serie CAFCI y estimacion por fondo)
        run: python -u cafci/cuotapartistas.py
      - name: Guardar planillas originales (cache, aunque falle algo despues)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cafci/raw
          key: planillas-${{ github.run_id }}
      - name: Commitear resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for d in cafci/procesado cafci/informes; do [ -e "$d" ] && git add "$d"; done
          if ! git diff --cached --quiet; then
            git commit -m "Planillas CAFCI-CNV: actualizacion automatica"
            for i in 1 2 3; do git pull --rebase -X theirs origin cafci-datos && git push origin HEAD:cafci-datos && break; sleep 10; done
          fi
