name: Explorar CNV
on:
  push:
    branches: [cafci-datos]
    paths: ['cafci/explorar/explorar.py', '.github/workflows/cnv-explorar.yml']
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {ref: cafci-datos}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: timeout 600 python -u cafci/explorar/explorar.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cafci/explorar/out && git commit -m "Exploracion CNV" && git pull --rebase origin cafci-datos && git push origin HEAD:cafci-datos || true
